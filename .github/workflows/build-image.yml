name: lpnode-dashboard

on:
  push:
    tags:
      - 'V*'
  workflow_dispatch:

jobs:
  update_dockerhub:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASS }}

      - name: Get latest tag
        uses: "WyriHaximus/github-action-get-previous-tag@v1"
        id: get-latest-tag
        with:
          fallback: latest

      - name: Build the lpnode-dashboard Docker image
        run: |
          docker build -f Dockerfile . --tag otmoic/lpnode-dashboard:${{ steps.get-latest-tag.outputs.tag }}
          docker push otmoic/lpnode-dashboard:${{ steps.get-latest-tag.outputs.tag }}